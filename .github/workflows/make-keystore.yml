name: Make Signing Keystore

# 一次性工具：生成固定签名的 keystore 供 build-apk 使用。
# 用法：Actions → Make Signing Keystore → Run workflow → 下载 artifact → 转成 base64
# 存成仓库 secret（KEYSTORE_BASE64 / KEYSTORE_PROPS），然后删掉本 workflow 和 artifact。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 keystore
        run: |
          keytool -genkeypair -v \
            -keystore breeze-release.jks \
            -alias breeze \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass breeze-ci-2026 \
            -keypass breeze-ci-2026 \
            -dname "CN=Breeze CI, OU=Personal, O=Breeze, L=NA, ST=NA, C=CN"

      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: breeze-keystore
          path: breeze-release.jks
          retention-days: 1
