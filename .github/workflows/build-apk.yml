name: Build Android APK

# 面向「自己的仓库 / Fork」的 Android 构建：不依赖上游的 git-crypt 签名密钥。
# 上游 push-build.yml 在没有 GIT_CRYPT_KEY 时会直接跳过 Android，这里用 debug 签名出可安装的包。
# 用法：Actions → Build Android APK → Run workflow；推到 main 也会自动跑一次。

on:
  workflow_dispatch:
    inputs:
      build_super_resolution:
        description: 同时编译 waifu2x CLI（超分功能，耗时很长，默认关闭）
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write

# 连推两次时只保留最新一次构建，避免排队跑两轮、产物版本混淆。
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: 重建 Android SDK 目录
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: 设置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 SDK Platform / build-tools / NDK / CMake
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VER" "cmake;3.22.1"
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 重新生成 i18n 代码
        run: fvm flutter pub run slang

      # 超分依赖会编译 OpenCV + ncnn 静态库，非常耗时；不开也能正常出包，
      # 只是 App 内「超分」功能在运行时会因缺少 libwaifu2x_cli.so 而失败。
      - name: 编译 waifu2x CLI（可选）
        if: ${{ inputs.build_super_resolution }}
        run: |
          python3 script/android/prepare_android_waifu2x_deps.py
          python3 script/android/build_ncnn_static_android.py
          python3 script/android/build_waifu2x_cli_android.py

      # 固定签名：AGP 在缺省路径生成 debug.keystore，每次新 runner 都会重新生成，
      # 导致每个 APK 签名不同、只能卸载重装。这里缓存同一个 keystore 复用。
      - name: 缓存签名（保证每次构建签名一致）
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 配了 KEYSTORE_BASE64 / KEYSTORE_PROPS 就用固定签名；没配则回退 debug 签名。
      - name: 应用固定签名（可选）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPS" ]; then
            echo "未配置签名 secret，继续使用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/breeze-release.jks
          printf '%s\n' "$KEYSTORE_PROPS" > android/key.properties
          echo "已写入固定签名配置"

      # 只编 arm64：省掉另外两个 ABI 的 Rust 编译，构建时间约减半；
      # 2015 年后的安卓机都是 arm64。需要全架构时把 target-platform 去掉即可。
      - name: 构建 APK
        run: |
          fvm flutter build apk --release --split-per-abi --target-platform=android-arm64 --dart-define=sentry_dsn=

      - name: 上传 APK
        uses: actions/upload-artifact@v6
        with:
          name: breeze-apk-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/*.apk

      # Artifact 的下载链接带鉴权，镜像加速用不了；同时挂一份到 Release，
      # 就能走 ghproxy 之类的镜像直接下单个 APK。
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/app/outputs/flutter-apk/*.apk --clobber
          else
            gh release create "$TAG" \
              --title "APK build #${{ github.run_number }}" \
              --notes "自动构建产物（debug 签名），提交 ${{ github.sha }}" \
              --prerelease \
              build/app/outputs/flutter-apk/*.apk
          fi
          echo "下载地址（国内可加镜像前缀 https://ghproxy.net/）："
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "  https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$apk")"
          done
